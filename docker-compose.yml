version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: pricetracker-db
    environment:
      POSTGRES_DB: pricetracker
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: